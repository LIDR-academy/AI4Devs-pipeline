name: 'Deploy to EC2'
description: 'Deploy application to EC2 with comprehensive monitoring and rollback capability'
inputs:
  ec2-host:
    description: 'EC2 instance hostname or IP'
    required: true
  ec2-username:
    description: 'EC2 instance username'
    required: true
  ec2-ssh-key:
    description: 'SSH private key for EC2 access'
    required: true
  ecr-registry:
    description: 'ECR registry URL'
    required: true
  image-name:
    description: 'Docker image name to deploy'
    required: true
  environment:
    description: 'Deployment environment (staging/production)'
    required: true
    default: 'production'

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        echo "=== Deployment Validation ==="
        echo "Environment: ${{ inputs.environment }}"
        echo "EC2 Host: ${{ inputs.ec2-host }}"
        echo "ECR Registry: ${{ inputs.ecr-registry }}"
        echo "Image: ${{ inputs.image-name }}"
        echo "=============================="

    - name: Check EC2 Instance Status
      shell: bash
      run: |
        echo "=== Checking EC2 Instance Status ==="
        echo "Target host: ${{ inputs.ec2-host }}"
        echo "Target username: ${{ inputs.ec2-username }}"
        
        # Check if instance is running
        echo "Checking EC2 instance status..."
        INSTANCE_STATE=$(aws ec2 describe-instances --instance-ids i-04dd98425eda7ee4b --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || echo "unknown")
        echo "Instance state: $INSTANCE_STATE"
        
        # Check public IP
        PUBLIC_IP=$(aws ec2 describe-instances --instance-ids i-04dd98425eda7ee4b --query 'Reservations[0].Instances[0].PublicIpAddress' --output text 2>/dev/null || echo "none")
        echo "Public IP: $PUBLIC_IP"
        
        # Check if public IP matches our target
        if [ "$PUBLIC_IP" != "${{ inputs.ec2-host }}" ] && [ "$PUBLIC_IP" != "None" ] && [ "$PUBLIC_IP" != "none" ]; then
          echo "⚠️ WARNING: Public IP ($PUBLIC_IP) doesn't match EC2_HOST secret (${{ inputs.ec2-host }})"
          echo "You may need to update the EC2_HOST secret with the correct IP"
        fi
        
        echo "=== EC2 Status Check Complete ==="

    - name: Validate SSH Key
      shell: bash
      run: |
        echo "=== Validating SSH Key ==="
        echo "SSH Key length: ${#EC2_SSH_KEY}"
        echo "SSH Key starts with: ${EC2_SSH_KEY:0:50}..."
        echo "SSH Key ends with: ...${EC2_SSH_KEY: -50}"
        
        # Check if key looks like a valid private key
        if [[ "$EC2_SSH_KEY" == *"BEGIN"*"PRIVATE KEY"* ]]; then
          echo "✅ SSH Key appears to be a valid private key"
        else
          echo "⚠️ SSH Key might not be in correct format"
        fi
        
        # Save key to file for validation
        echo "$EC2_SSH_KEY" > /tmp/ssh_key
        chmod 600 /tmp/ssh_key
        
        # Try to validate with ssh-keygen
        if ssh-keygen -l -f /tmp/ssh_key >/dev/null 2>&1; then
          echo "✅ SSH key validation passed"
          ssh-keygen -l -f /tmp/ssh_key
        else
          echo "❌ SSH key validation failed"
        fi
        
        # Clean up
        rm -f /tmp/ssh_key
      env:
        EC2_SSH_KEY: ${{ inputs.ec2-ssh-key }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ inputs.ec2-host }}
        username: ${{ inputs.ec2-username }}
        key: ${{ inputs.ec2-ssh-key }}
        port: 22
        timeout: 120s
        debug: true
        envs: ECR_REGISTRY,IMAGE_NAME,ENVIRONMENT
        script: |
          set -e  # Exit on any error
          echo "=== Starting Enhanced Deployment ==="
          echo "Environment: $ENVIRONMENT"
          echo "Timestamp: $(date)"
          
          # Create application directory if it doesn't exist
          echo "Creating application directory..."
          mkdir -p /home/ec2-user/lti-backend
          
          # Setup PostgreSQL database (only if not already set up)
          echo "Setting up PostgreSQL database..."
          if ! pgrep -f postgres > /dev/null; then
            sudo yum update -y
            sudo yum install -y postgresql15 postgresql15-server
            
            # Initialize PostgreSQL database
            echo "Initializing PostgreSQL database..."
            
            # Clean up any existing PostgreSQL data directory
            echo "Cleaning up existing PostgreSQL data directory..."
            sudo rm -rf /var/lib/pgsql/15/data
            
            # Create and set proper permissions for PostgreSQL directories
            echo "Setting up PostgreSQL directories and permissions..."
            sudo mkdir -p /var/lib/pgsql/15
            sudo chown -R postgres:postgres /var/lib/pgsql/15
            sudo chmod 700 /var/lib/pgsql/15
            
            # Find the correct initdb path
            INITDB_PATH=$(find /usr -name "initdb" 2>/dev/null | head -1)
            if [ -z "$INITDB_PATH" ]; then
              echo "initdb not found, trying alternative paths..."
              # Try common paths for Amazon Linux 2023
              for path in "/usr/bin/initdb" "/usr/pgsql-15/bin/initdb" "/usr/lib/postgresql/15/bin/initdb"; do
                if [ -f "$path" ]; then
                  INITDB_PATH="$path"
                  break
                fi
              done
            fi
            
            if [ -n "$INITDB_PATH" ]; then
              echo "Using initdb at: $INITDB_PATH"
              # Initialize with proper working directory to avoid permission issues
              cd /tmp
              sudo -u postgres $INITDB_PATH -D /var/lib/pgsql/15/data
            else
              echo "initdb not found, trying to initialize with systemctl"
              sudo systemctl start postgresql-15
              sleep 5
            fi
            
            # Start PostgreSQL service
            echo "Starting PostgreSQL service..."
            
            # Create log directory for PostgreSQL
            sudo mkdir -p /var/lib/pgsql/15/data
            sudo chown -R postgres:postgres /var/lib/pgsql/15/data
            
            # Start PostgreSQL manually using pg_ctl (recommended by initdb)
            echo "Starting PostgreSQL using pg_ctl..."
            sudo -u postgres /usr/bin/pg_ctl -D /var/lib/pgsql/15/data -l /var/lib/pgsql/15/data/logfile start
            
            # Wait for PostgreSQL to start
            sleep 10
            
            # Verify PostgreSQL is running
            if pgrep -f postgres > /dev/null; then
              echo "PostgreSQL is running successfully"
            else
              echo "PostgreSQL failed to start, checking logs..."
              sudo -u postgres cat /var/lib/pgsql/15/data/logfile || echo "No logfile found"
              echo "Trying to start PostgreSQL again..."
              sudo -u postgres /usr/bin/pg_ctl -D /var/lib/pgsql/15/data -l /var/lib/pgsql/15/data/logfile start
              sleep 5
            fi
            
            # Create database and user
            sudo -u postgres psql -c "CREATE USER LTIdbUser WITH PASSWORD 'D1ymf8wyQEGthFR1E9xhCq';" || echo "User might already exist"
            sudo -u postgres psql -c "CREATE DATABASE LTIdb OWNER LTIdbUser;" || echo "Database might already exist"
            sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE LTIdb TO LTIdbUser;"
          else
            echo "PostgreSQL is already running"
          fi
          
          # Update environment variables
          echo "Setting up environment variables..."
          echo "DATABASE_URL=postgresql://LTIdbUser:D1ymf8wyQEGthFR1E9xhCq@localhost:5432/LTIdb" > /home/ec2-user/lti-backend/.env
          echo "NODE_ENV=production" >> /home/ec2-user/lti-backend/.env
          echo "PORT=3010" >> /home/ec2-user/lti-backend/.env
          echo "ENVIRONMENT=$ENVIRONMENT" >> /home/ec2-user/lti-backend/.env
          
          # Login to ECR
          echo "Logging into ECR..."
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $ECR_REGISTRY || {
            echo "ECR login failed!"
            exit 1
          }
          
          # Create backup of current deployment
          echo "Creating backup of current deployment..."
          if docker ps -q -f name=lti-backend | grep -q .; then
            echo "Backing up current container..."
            docker tag lti-backend lti-backend-backup-$(date +%Y%m%d-%H%M%S) || echo "No existing container to backup"
          fi
          
          # Stop existing container
          echo "Stopping existing container..."
          docker stop lti-backend || echo "No existing container to stop"
          docker rm lti-backend || echo "No existing container to remove"
          
          # Pull and run new image
          echo "Pulling new image: $IMAGE_NAME"
          docker pull $IMAGE_NAME || {
            echo "Failed to pull image!"
            exit 1
          }
          
          echo "Starting new container..."
          docker run -d \
            --name lti-backend \
            --restart unless-stopped \
            -p 3010:3010 \
            --env-file /home/ec2-user/lti-backend/.env \
            --network host \
            --health-cmd="curl -f http://localhost:3010/ || exit 1" \
            --health-interval=30s \
            --health-timeout=10s \
            --health-retries=3 \
            $IMAGE_NAME || {
            echo "Failed to start container!"
            exit 1
          }
          
          # Wait for container to start
          echo "Waiting for container to start..."
          sleep 15
          
          # Check container status
          echo "Container status:"
          docker ps -a
          
          # Check container logs
          echo "Container logs:"
          docker logs lti-backend
          
          # Run Prisma migrations
          echo "Running Prisma migrations..."
          docker exec lti-backend npx prisma migrate deploy || {
            echo "Prisma migrations failed, but continuing..."
          }
          
          # Enhanced health check
          echo "Starting comprehensive health check..."
          HEALTH_CHECK_PASSED=false
          for i in {1..30}; do
            echo "Health check attempt $i/30..."
            
            # Check if container is running
            if ! docker ps -q -f name=lti-backend | grep -q .; then
              echo "Container is not running!"
              docker logs lti-backend
              break
            fi
            
            # Check application health
            if curl -f http://0.0.0.0:3010/; then
              echo "✅ Health check passed!"
              HEALTH_CHECK_PASSED=true
              break
            fi
            
            echo "Health check attempt $i failed, retrying in 2 seconds..."
            sleep 2
          done
          
          if [ "$HEALTH_CHECK_PASSED" = false ]; then
            echo "❌ Health check failed after 30 attempts"
            echo "Container logs:"
            docker logs lti-backend
            echo "Rolling back to previous version..."
            
            # Rollback logic
            if docker images | grep -q "lti-backend-backup"; then
              echo "Rolling back to backup..."
              docker stop lti-backend || true
              docker rm lti-backend || true
              docker run -d \
                --name lti-backend \
                --restart unless-stopped \
                -p 3010:3010 \
                --env-file /home/ec2-user/lti-backend/.env \
                --network host \
                $(docker images --format "table {{.Repository}}:{{.Tag}}" | grep "lti-backend-backup" | head -1)
              echo "Rollback completed"
            else
              echo "No backup available for rollback"
            fi
            exit 1
          fi
          
          # Clean up old images (keep last 3 versions)
          echo "Cleaning up old images..."
          docker image prune -f
          docker images --format "table {{.Repository}}:{{.Tag}}" | grep "lti-backend-backup" | tail -n +4 | xargs -r docker rmi || echo "No old images to clean up"
          
          # Performance monitoring
          echo "=== Performance Metrics ==="
          echo "Container CPU usage:"
          docker stats lti-backend --no-stream --format "table {{.CPUPerc}}"
          echo "Container Memory usage:"
          docker stats lti-backend --no-stream --format "table {{.MemUsage}}"
          echo "=========================="
          
          echo "=== Enhanced Deployment Complete ==="
          echo "Environment: $ENVIRONMENT"
          echo "Timestamp: $(date)"
          echo "Image: $IMAGE_NAME"
          echo "Health Status: ✅ PASSED"
      env:
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        IMAGE_NAME: ${{ inputs.image-name }}
        ENVIRONMENT: ${{ inputs.environment }}
