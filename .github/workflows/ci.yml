  build-and-deploy:
    name: Build and Deploy Backend
    needs: test
    runs-on: ubuntu-latest
    # Only deploy on push to pipeline-OS branch, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/pipeline-OS'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.5.3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm install
      
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      
      - name: Build application
        working-directory: backend
        run: npm run build
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Get EC2 instance information
        run: |
          echo "Getting EC2 instance details"
          aws ec2 describe-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }} --query 'Reservations[*].Instances[*].{State:State.Name,PublicDnsName:PublicDnsName}' --output json
      
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      
      - name: Setup known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_INSTANCE }} >> ~/.ssh/known_hosts
          
      - name: Copy files to EC2
        run: |
          cd backend
          # First copy the built files
          rsync -avz --delete dist/ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_INSTANCE }}:/home/${{ secrets.EC2_USERNAME }}/backend/
          # Then copy the package files
          rsync -avz package.json package-lock.json ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_INSTANCE }}:/home/${{ secrets.EC2_USERNAME }}/backend/
      
      - name: Deploy application
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_INSTANCE }} << 'EOF'
            cd ~/backend
            npm install --production
            pm2 stop backend || true
            pm2 start index.js --name backend
            pm2 save
          EOF