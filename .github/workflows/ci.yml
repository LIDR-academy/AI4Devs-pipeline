name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, 'release/**']

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Backend — type check, lint, unit tests, build
  # No requiere base de datos real: los tests unitarios mockean Prisma
  # ──────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend — Type Check, Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint "src/**/*.ts"

      - name: Run unit tests
        run: npm test -- --coverage --ci --forceExit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          NODE_ENV: test

      - name: Build (TypeScript → JS)
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Frontend — tests y build
  # CI:false en el build evita que warnings de CRA fallen el job
  # (a largo plazo: corregir warnings y poner CI:true)
  # ──────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false --coverage
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:3010

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Security audit de dependencias
  # Falla si hay vulnerabilidades HIGH o CRITICAL
  # ──────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
