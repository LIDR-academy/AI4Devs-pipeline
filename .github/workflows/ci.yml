name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - 'pipeline-OS'
      - 'main'
      - 'master'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'pipeline-OS'
      - 'main'
      - 'master'

