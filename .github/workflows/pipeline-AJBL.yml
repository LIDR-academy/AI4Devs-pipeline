name: Backend CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install backend dependencies
        run: npm install
        working-directory: ./backend

      - name: Run backend tests
        run: npm test
        working-directory: ./backend

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test-backend # Asegura que los tests pasen antes de construir
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install backend dependencies
        run: npm install
        working-directory: ./backend

      - name: Build backend application
        run: npm run build
        working-directory: ./backend

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build # Nombre del artefacto
          path: backend/dist/ # Directorio a empaquetar

  deploy-backend:
    name: Deploy Backend to EC2 with Nginx (Lightrains Style)
    runs-on: ubuntu-latest
    needs: build-backend
    env: # Variables de entorno a nivel de job, accesibles en todos los pasos
      EC2_INSTANCE_IP_FROM_SECRETS: ${{ secrets.EC2_INSTANCE_IP }}
      EC2_USER_FROM_SECRETS: ${{ secrets.EC2_USER }}
      TARGET_PATH_ON_EC2: /srv/lti-backend # Directorio de la aplicación en EC2
      PM2_APP_NAME: lti-backend
      NGINX_CONFIG_REMOTE_PATH: /etc/nginx/conf.d/default.conf

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-build-artifact

      - name: Prepare deployment package
        run: |
          mkdir -p deploy_package/dist
          mkdir -p deploy_package/ops/nginx
          echo "Copying build artifacts into deploy_package/dist/..."
          cp -r ./backend-build-artifact/* ./deploy_package/dist/
          echo "Copying package.json and package-lock.json into deploy_package/..."
          cp ./backend/package.json ./deploy_package/
          cp ./backend/package-lock.json ./deploy_package/
          echo "Copying Nginx config into deploy_package/ops/nginx/..."
          if [ -f ./ops/nginx/default.conf ]; then
            cp ./ops/nginx/default.conf ./deploy_package/ops/nginx/default.conf
          else
            echo "ERROR: Nginx config file ./ops/nginx/default.conf not found!"
            exit 1
          fi
          echo "Contents of deploy_package:"
          ls -R ./deploy_package/

      - name: Deploy files to EC2 (Lightrains Style)
        uses: easingthemes/ssh-deploy@main # El blog usa @main, se recomienda usar una versión específica como @v5.0.0 para estabilidad
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }} # Directamente desde secrets
          REMOTE_HOST: ${{ env.EC2_INSTANCE_IP_FROM_SECRETS }} # Usando la variable de entorno del job
          REMOTE_USER: ${{ env.EC2_USER_FROM_SECRETS }}      # Usando la variable de entorno del job
          SOURCE: "deploy_package/"                             # Directorio local a sincronizar
          TARGET: ${{ env.TARGET_PATH_ON_EC2 }}               # Directorio de destino en EC2, usando la variable de entorno del job
          ARGS: "-rltgoDzvO --delete"                         # Argumentos para rsync para sincronización eficiente

      - name: Install Nginx, Configure and Restart Services on EC2
        uses: appleboy/ssh-action@v1.0.0 # O la última versión estable
        with:
          host: ${{ env.EC2_INSTANCE_IP_FROM_SECRETS }}
          username: ${{ env.EC2_USER_FROM_SECRETS }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Updating package list and Installing Nginx (Amazon Linux)..."
            sudo yum update -y
            sudo yum install -y nginx
            sudo systemctl enable nginx
            sudo systemctl start nginx

            echo "Copying Nginx configuration..."
            sudo cp ${{ env.TARGET_PATH_ON_EC2 }}/ops/nginx/default.conf ${{ env.NGINX_CONFIG_REMOTE_PATH }}
            
            echo "Validating Nginx configuration..."
            sudo nginx -t
            
            echo "Reloading Nginx to apply changes..."
            sudo systemctl reload nginx

            echo "Navigating to application path: ${{ env.TARGET_PATH_ON_EC2 }}"
            cd ${{ env.TARGET_PATH_ON_EC2 }}
            
            echo "Installing production dependencies for Node.js app..."
            npm install --production
            
            echo "Restarting Node.js application with PM2: ${{ env.PM2_APP_NAME }}"
            pm2 restart ${{ env.PM2_APP_NAME }} || pm2 start npm --name "${{ env.PM2_APP_NAME }}" -- run start
            
            echo "Deployment to EC2 with Nginx completed."
