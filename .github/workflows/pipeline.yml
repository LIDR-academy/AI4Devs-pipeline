name: Enhanced Backend CI/CD Pipeline

on:
  push:
    branches: [ main, pipeline-mg, staging ]
  pull_request:
    branches: [ main, pipeline-mg, staging ]

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: lti-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Priority 1: Parallel execution and conditional deployments
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Generate Prisma client
      working-directory: ./backend
      run: npx prisma generate

    - name: Run tests
      working-directory: ./backend
      run: npm test

    - name: Build application
      working-directory: ./backend
      run: npm run build

  # Priority 2: Docker layer caching and build optimization
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  # Priority 1: Conditional deployment based on branch
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/pipeline-mg')
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to EC2
      uses: ./.github/actions/deploy
      with:
        ec2-host: ${{ secrets.EC2_HOST_STAGING }}
        ec2-username: ${{ secrets.EC2_USERNAME }}
        ec2-ssh-key: ${{ secrets.EC2_SSH_KEY }}
        ecr-registry: ${{ needs.build.outputs.registry }}
        image-name: ${{ needs.build.outputs.image }}
        environment: staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pipeline-mg')
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to EC2
      uses: ./.github/actions/deploy
      with:
        ec2-host: ${{ secrets.EC2_HOST }}
        ec2-username: ${{ secrets.EC2_USERNAME }}
        ec2-ssh-key: ${{ secrets.EC2_SSH_KEY }}
        ecr-registry: ${{ needs.build.outputs.registry }}
        image-name: ${{ needs.build.outputs.image }}
        environment: production

  # Priority 3: Security scanning and monitoring
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Priority 3: Performance monitoring
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pipeline-mg')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Generate Prisma client
      working-directory: ./backend
      run: npx prisma generate

    - name: Build application
      working-directory: ./backend
      run: npm run build

    - name: Start application for testing
      working-directory: ./backend
      run: |
        # Create a simple test environment file
        echo "NODE_ENV=test" > .env.test
        echo "PORT=3010" >> .env.test
        echo "DATABASE_URL=file:./test.db" >> .env.test
        
        # Start the application in background
        npm start &
        APP_PID=$!
        
        # Wait for application to start
        sleep 10
        
        # Check if application is running
        if curl -f http://localhost:3010/; then
          echo "Application started successfully"
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
        else
          echo "Application failed to start"
          kill $APP_PID 2>/dev/null || true
          exit 1
        fi

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        configPath: './lighthouse.config.js'
        uploadArtifacts: false
        temporaryPublicStorage: false

    - name: Cleanup
      if: always()
      run: |
        if [ -n "$APP_PID" ]; then
          echo "Stopping application..."
          kill $APP_PID 2>/dev/null || true
        fi

  # Priority 2: Rollback mechanism
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pipeline-mg')
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Rollback to previous version
      uses: ./.github/actions/rollback
      with:
        ec2-host: ${{ secrets.EC2_HOST }}
        ec2-username: ${{ secrets.EC2_USERNAME }}
        ec2-ssh-key: ${{ secrets.EC2_SSH_KEY }}
        ecr-registry: ${{ needs.build.outputs.registry }}
        environment: production

  # Priority 3: Notification and monitoring
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    
    steps:
    - name: Check Slack webhook availability
      id: check-slack
      run: |
        if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
          echo "slack_available=true" >> $GITHUB_OUTPUT
        else
          echo "slack_available=false" >> $GITHUB_OUTPUT
        fi

    - name: Notify Slack on Success
      if: (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success') && steps.check-slack.outputs.slack_available == 'true'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🚀 Deployment successful!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on Failure
      if: (needs.deploy-production.result == 'failure' || needs.deploy-staging.result == 'failure') && steps.check-slack.outputs.slack_available == 'true'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ Deployment failed!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Log notification status
      if: always()
      run: |
        if [ "${{ steps.check-slack.outputs.slack_available }}" == "true" ]; then
          echo "✅ Slack notifications enabled"
        else
          echo "ℹ️ Slack notifications disabled - SLACK_WEBHOOK_URL secret not configured"
        fi