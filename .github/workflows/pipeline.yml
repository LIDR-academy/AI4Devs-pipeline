name: AI4Devs Pipeline - Backend Tests, Build & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: 🧪 Tests Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: 📥 Install dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: 🧪 Run tests
      working-directory: ./backend
      run: npm test
      env:
        NODE_ENV: test
        
    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: backend/coverage/
        retention-days: 7

  build-backend:
    name: 🏗️ Build Backend
    runs-on: ubuntu-latest
    needs: test-backend
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: 📥 Install dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: 🏗️ Build application
      working-directory: ./backend
      run: npm run build
      env:
        NODE_ENV: production
        
    - name: 📦 Create deployment package
      run: |
        cd backend
        mkdir -p ../deployment
        cp -r dist ../deployment/
        cp package*.json ../deployment/
        cp prisma ../deployment/ -r
        cd ../deployment
        tar -czf backend-deployment.tar.gz .
        
    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: deployment/backend-deployment.tar.gz
        retention-days: 1

  deploy-backend:
    name: 🚀 Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: [test-backend, build-backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-build
        path: ./deployment
        
    - name: 🔧 Setup AWS CLI
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: 🚀 Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # Crear directorio de aplicación si no existe
          mkdir -p /home/ec2-user/ai4devs-backend
          cd /home/ec2-user/ai4devs-backend
          
          # Detener aplicación anterior si está corriendo
          pm2 stop ai4devs-backend || true
          pm2 delete ai4devs-backend || true
          
          # Limpiar directorio anterior
          rm -rf *
          
    - name: 📤 Upload application to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        source: "deployment/backend-deployment.tar.gz"
        target: "/home/ec2-user/ai4devs-backend/"
        
    - name: 🔧 Extract and setup application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          cd /home/ec2-user/ai4devs-backend
          
          # Extraer archivos
          tar -xzf backend-deployment.tar.gz
          rm backend-deployment.tar.gz
          
          # Instalar dependencias de producción
          npm ci --only=production
          
          # Ejecutar migraciones de base de datos
          npx prisma migrate deploy
          
          # Iniciar aplicación con PM2
          pm2 start dist/index.js --name ai4devs-backend --env production
          pm2 save
          pm2 startup
          
    - name: ✅ Verify deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # Verificar que la aplicación está corriendo
          pm2 status
          
          # Verificar que el puerto está abierto
          netstat -tlnp | grep :8080 || echo "Puerto 8080 no está abierto"
          
          # Health check básico
          curl -f http://localhost:8080/health || echo "Health check falló"

  notify-deployment:
    name: 📢 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [test-backend, build-backend, deploy-backend]
    if: always()
    
    steps:
    - name: 📢 Notify Success
      if: needs.deploy-backend.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        echo "Backend deployed to EC2 successfully"
        
    - name: 📢 Notify Failure
      if: needs.deploy-backend.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs for more details"