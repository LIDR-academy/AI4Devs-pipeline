# Pipeline CI/CD para el backend Node.js (Express + TypeScript)
# Se ejecuta en cada push que tenga un Pull Request abierto asociado

name: CI/CD Pipeline

on:
  push:
    branches:
      - '**' # Escucha todos los pushes; el job "test" filtra si hay PR abierto

jobs:
  # ─────────────────────────────────────────────
  # FASE 1: Tests
  # ─────────────────────────────────────────────
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    # Comprueba que la rama tiene un PR abierto antes de continuar
    # Si no hay PR abierto, el workflow se omite sin error
    if: github.event_name == 'push'

    steps:
      - name: Check for open Pull Request on this branch
        id: check_pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open',
            });
            if (pulls.length === 0) {
              core.setFailed('No open Pull Request found for this branch. Skipping pipeline.');
            }

      - name: Checkout code
        uses: actions/checkout@v4

      # Ajusta la versión de Node.js si tu proyecto requiere otra
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  # ─────────────────────────────────────────────
  # FASE 2: Build
  # ─────────────────────────────────────────────
  build:
    name: Build backend
    runs-on: ubuntu-latest
    needs: test # Solo se ejecuta si "test" pasa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Genera el build de producción (tsc → dist/)
      # Si usas otro stack, reemplaza este comando por el tuyo
      - name: Build production artifact
        working-directory: backend
        run: npm run build

      # Empaqueta solo lo necesario para producción
      - name: Package artifact
        run: |
          mkdir -p artifact
          cp -r backend/dist artifact/dist
          cp backend/package.json artifact/
          cp backend/package-lock.json artifact/

      # Sube el artefacto para que "deploy" lo descargue
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: artifact/
          retention-days: 1

  # ─────────────────────────────────────────────
  # FASE 3: Deploy a EC2
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build # Solo se ejecuta si "build" pasa

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: artifact/

      # Escribe la clave SSH desde el secreto para usarla con scp/ssh
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # Copia el artefacto al servidor EC2
      # Ajusta el directorio de destino si tu servidor usa otra ruta
      - name: Copy artifact to EC2
        run: |
          scp -i ~/.ssh/deploy_key -r artifact/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/

      # Instala dependencias de producción y reinicia el servicio con PM2
      # Si usas systemd u otro gestor, reemplaza los comandos de PM2
      - name: Deploy and restart service
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /home/$USER/app
            npm ci --omit=dev
            # Reinicia o arranca la aplicación con PM2
            pm2 describe backend > /dev/null 2>&1 \
              && pm2 restart backend \
              || pm2 start dist/index.js --name backend
            pm2 save
          EOF
