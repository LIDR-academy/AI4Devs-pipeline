name: Backend CI/CD Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main', 'develop']

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Generate Prisma client
      working-directory: ./backend
      run: npx prisma generate

    - name: Run tests
      working-directory: ./backend
      run: npm test

    - name: Build application
      working-directory: ./backend
      run: npm run build

  build-and-deploy:
    name: Build and Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: lti-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Test EC2 Connection
      run: |
        echo "=== Testing EC2 Connection ==="
        
        # Test SSH connectivity (without ping which is often blocked)
        echo "Testing SSH connectivity to ${{ secrets.EC2_HOST }}..."
        timeout 10 bash -c "</dev/tcp/${{ secrets.EC2_HOST }}/22" && echo "✅ SSH port 22 is accessible" || echo "⚠️ SSH port 22 test completed"
        
        echo "=== Connection Test Complete ==="

    - name: Deploy to EC2 using Instance Connect
      run: |
        set -e  # Exit on any error
        echo "=== Starting EC2 Instance Connect Deployment ==="
        
        # Generate a temporary SSH key pair for this session
        ssh-keygen -t rsa -b 2048 -f /tmp/ec2_key -N "" -q
        
        # Send the public key to EC2 Instance Connect
        echo "Sending SSH public key to EC2 Instance Connect..."
        aws ec2-instance-connect send-ssh-public-key \
          --instance-id i-04dd98425eda7ee4b \
          --availability-zone us-east-2a \
          --instance-os-user ec2-user \
          --ssh-public-key file:///tmp/ec2_key.pub
        
        # Wait a moment for the key to be registered
        sleep 5
        
        # Create deployment script
        cat > /tmp/deploy_script.sh << 'EOF'
        set -e
        echo "=== Starting Deployment on EC2 ==="
        
        # Create application directory if it doesn't exist
        echo "Creating application directory..."
        mkdir -p /home/ec2-user/lti-backend
        
        # Update environment variables
        echo "Setting up environment variables..."
        echo "DATABASE_URL=postgresql://LTIdbUser:D1ymf8wyQEGthFR1E9xhCq@localhost:5432/LTIdb" > /home/ec2-user/lti-backend/.env
        echo "NODE_ENV=production" >> /home/ec2-user/lti-backend/.env
        echo "PORT=3010" >> /home/ec2-user/lti-backend/.env
        
        # Debug: Show current directory and files
        echo "Current directory: $(pwd)"
        echo "Contents of /home/ec2-user/: $(ls -la /home/ec2-user/)"
        
        # Login to ECR
        echo "Logging into ECR..."
        aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 851725501802.dkr.ecr.us-east-2.amazonaws.com
        
        # Stop existing container
        echo "Stopping existing container..."
        docker stop lti-backend || echo "No existing container to stop"
        docker rm lti-backend || echo "No existing container to remove"
        
        # Pull and run new image
        echo "Pulling new image: ${{ steps.build-image.outputs.image }}"
        docker pull ${{ steps.build-image.outputs.image }}
        
        echo "Starting new container..."
        docker run -d \
          --name lti-backend \
          --restart unless-stopped \
          -p 3010:3010 \
          --env-file /home/ec2-user/lti-backend/.env \
          --network host \
          ${{ steps.build-image.outputs.image }}
        
        # Wait for container to start
        echo "Waiting for container to start..."
        sleep 10
        
        # Check container status
        echo "Container status:"
        docker ps -a
        
        # Check container logs
        echo "Container logs:"
        docker logs lti-backend
        
        # Health check
        echo "Starting health check..."
        for i in {1..30}; do
          if curl -f http://localhost:3010/; then
            echo "Health check passed"
            break
          fi
          echo "Health check attempt $i failed, retrying..."
          sleep 2
        done
        
        # Clean up old images
        docker image prune -f
        
        echo "=== Deployment Complete ==="
        EOF
        
        # Copy deployment script to EC2 and execute it
        echo "Copying deployment script to EC2..."
        scp -i /tmp/ec2_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          /tmp/deploy_script.sh ec2-user@${{ secrets.EC2_HOST }}:/tmp/deploy_script.sh
        
        echo "Executing deployment script on EC2..."
        ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          ec2-user@${{ secrets.EC2_HOST }} "chmod +x /tmp/deploy_script.sh && /tmp/deploy_script.sh"
        
        # Clean up temporary files
        rm -f /tmp/ec2_key /tmp/ec2_key.pub /tmp/deploy_script.sh
        
        echo "=== EC2 Instance Connect Deployment Complete ==="

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
