name: Backend CI/CD Pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '18'
  BACKEND_DIR: 'backend'
  BUILD_DIR: 'dist'
  EC2_APP_PATH: '/home/ec2-user/app'

jobs:
  test:
    name: 'Backend Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: 'Checkout código'
        uses: actions/checkout@v4
        
      - name: 'Configurar Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: 'Instalar dependencias'
        run: npm ci
        
      - name: 'Ejecutar tests'
        run: npm test

  build:
    name: 'Backend Build'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: 'Checkout código'
        uses: actions/checkout@v4
        
      - name: 'Configurar Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: 'Instalar dependencias'
        run: npm ci
        
      - name: 'Generar Prisma Client'
        run: npm run prisma:generate
        
      - name: 'Compilar TypeScript'
        run: npm run build
        
      - name: 'Verificar build exitoso'
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Error: Build falló - index.js no encontrado"
            exit 1
          fi
          echo "✅ Build completado exitosamente"
        
      - name: 'Subir artefactos del build'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            backend/prisma/
          retention-days: 5

  deploy:
    name: 'Deploy to EC2'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    
    environment:
      name: production
    
    steps:
      - name: 'Checkout código'
        uses: actions/checkout@v4
        
      - name: 'Descargar artefactos del build'
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-build
          
      - name: 'Configurar SSH'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          
      - name: 'Crear directorio de aplicación'
        run: |
          echo "📁 Creando directorio de aplicación..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ${{ env.EC2_APP_PATH }}"
          
      - name: 'Copiar archivos al servidor'
        run: |
          echo "📦 Copiando archivos al servidor..."
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -r ./backend-build/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.EC2_APP_PATH }}/
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no scripts/deploy.sh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.EC2_APP_PATH }}/
          
      - name: 'Ejecutar deployment'
        run: |
          echo "🚀 Ejecutando deployment..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "chmod +x ${{ env.EC2_APP_PATH }}/deploy.sh && cd ${{ env.EC2_APP_PATH }} && ./deploy.sh"
          
      - name: 'Verificar deployment'
        run: |
          echo "🔍 Verificando deployment..."
          sleep 5
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "curl -f http://localhost:3010 && echo '✅ Aplicación funcionando'"
          
      - name: 'Limpiar archivos SSH'
        if: always()
        run: rm -f ~/.ssh/id_rsa

  notify:
    name: 'Notificar resultado'
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always()
    
    steps:
      - name: 'Notificar éxito'
        if: needs.test.result == 'success' && needs.build.result == 'success' && needs.deploy.result == 'success'
        run: |
          echo "🎉 Pipeline completado exitosamente!"
          echo "✅ Tests: Pasados"
          echo "✅ Build: Exitoso" 
          echo "✅ Deploy: Completado"
          
      - name: 'Notificar fallo'
        if: needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "❌ Pipeline falló:"
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          exit 1