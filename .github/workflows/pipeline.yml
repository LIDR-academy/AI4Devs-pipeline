name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v3
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint code
      run: npm run lint || echo "Linting failed but continuing"
    
    - name: Run unit tests with coverage
      run: npm test -- --coverage
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage
        path: ./backend/coverage
    
    - name: Build
      run: npm run build
    
    - name: Generate version
      id: version
      run: echo "::set-output name=build_id::backend-${{ github.run_number }}-${{ github.sha }}"
    
    - name: Tag build
      run: |
        echo "Build ID: ${{ steps.version.outputs.build_id }}" > ./build/VERSION.txt
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-build-${{ github.run_number }}
        path: ./backend/build

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint code
      run: npm run lint || echo "Linting failed but continuing"
    
    - name: Run unit tests with coverage
      run: npm test -- --coverage
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: frontend-coverage
        path: ./frontend/coverage
    
    - name: Build
      run: npm run build
    
    - name: Generate version
      id: version
      run: echo "::set-output name=build_id::frontend-${{ github.run_number }}-${{ github.sha }}"
    
    - name: Tag build
      run: |
        echo "Build ID: ${{ steps.version.outputs.build_id }}" > ./build/VERSION.txt
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build-${{ github.run_number }}
        path: ./frontend/build

  notify:
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    if: always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    steps:
      - name: Build Result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "false" ]]; then
            echo "Build completed successfully! Build number ${{ github.run_number }}"
          else
            echo "Build failed! Check logs for details."
            exit 1
          fi
