name: Backend CI/CD Pipeline

# Trigger: Push a ramas con PR abierto
on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Permisos necesarios
permissions:
  contents: read
  pull-requests: read

# Variables globales
env:
  NODE_VERSION: '18'
  BACKEND_DIR: 'backend'
  BUILD_DIR: 'dist'
  EC2_APP_PATH: '/home/ec2-user/app'

jobs:
  # Job 1: Tests de Backend
  test:
    name: 'Backend Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: 'Checkout código'
        uses: actions/checkout@v4
        
      - name: 'Configurar Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: 'Instalar dependencias'
        run: npm ci
        
      - name: 'Ejecutar tests'
        run: npm test

  # Job 2: Build del Backend  
  build:
    name: 'Backend Build'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: 'Checkout código'
        uses: actions/checkout@v4
        
      - name: 'Configurar Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: 'Instalar dependencias'
        run: npm ci
        
      - name: 'Generar Prisma Client'
        run: npm run prisma:generate
        
      - name: 'Compilar TypeScript'
        run: npm run build
        
      - name: 'Verificar build exitoso'
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Error: Build falló - index.js no encontrado"
            exit 1
          fi
          echo "✅ Build completado exitosamente"
        
      - name: 'Subir artefactos del build'
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            backend/prisma/
          retention-days: 5

  # Job 3: Despliegue a EC2
  deploy:
    name: 'Deploy to EC2'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    
    # Solo ejecutar en push a ramas con PR (no en draft)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    
    environment:
      name: production
    
    steps:
      - name: 'Descargar artefactos del build'
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-build
          
      - name: 'Configurar SSH'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          
      - name: 'Verificar conexión SSH'
        run: |
          ssh -o ConnectTimeout=10 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo '✅ Conexión SSH exitosa'"
          
      - name: 'Crear backup de la aplicación actual'
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            if [ -d '${{ env.EC2_APP_PATH }}' ]; then
              sudo cp -r ${{ env.EC2_APP_PATH }} ${{ env.EC2_APP_PATH }}_backup_\$(date +%Y%m%d_%H%M%S)
              echo '✅ Backup creado'
            else
              echo 'ℹ️ Primera instalación - no hay backup que crear'
            fi
          "
          
      - name: 'Copiar archivos al servidor'
        run: |
          scp -r ./backend-build/* ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.EC2_APP_PATH }}/
          echo "✅ Archivos copiados al servidor"
          
      - name: 'Instalar dependencias en servidor'
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ${{ env.EC2_APP_PATH }}
            npm ci --only=production
            echo '✅ Dependencias instaladas'
          "
          
      - name: 'Reiniciar aplicación'
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            # Detener aplicación si está corriendo
            pkill -f 'node.*index.js' || true
            
            # Esperar a que termine completamente
            sleep 3
            
            # Iniciar aplicación en background
            cd ${{ env.EC2_APP_PATH }}
            nohup npm start > app.log 2>&1 &
            
            echo '✅ Aplicación reiniciada'
          "
          
      - name: 'Verificar despliegue'
        run: |
          echo "🔍 Verificando que la aplicación esté funcionando..."
          sleep 10
          
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            # Verificar que el proceso esté corriendo
            if pgrep -f 'node.*index.js' > /dev/null; then
              echo '✅ Aplicación está corriendo'
              echo 'PID:' \$(pgrep -f 'node.*index.js')
            else
              echo '❌ Error: Aplicación no está corriendo'
              echo 'Últimas líneas del log:'
              tail -20 ${{ env.EC2_APP_PATH }}/app.log
              exit 1
            fi
          "
          
      - name: 'Limpiar archivos SSH'
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          echo "🧹 Archivos SSH limpiados"

  # Job de notificación (opcional)
  notify:
    name: 'Notificar resultado'
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always()
    
    steps:
      - name: 'Notificar éxito'
        if: needs.test.result == 'success' && needs.build.result == 'success' && needs.deploy.result == 'success'
        run: |
          echo "🎉 Pipeline completado exitosamente!"
          echo "✅ Tests: Pasados"
          echo "✅ Build: Exitoso" 
          echo "✅ Deploy: Completado"
          
      - name: 'Notificar fallo'
        if: needs.test.result == 'failure' || needs.build.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "❌ Pipeline falló:"
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          exit 1