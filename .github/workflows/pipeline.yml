name: Backend CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - pipeline-OS

jobs:
  test:
    name: Test Backend
    # Run for branches with open PRs
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm install
      
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      
      - name: Run tests
        working-directory: backend
        run: npm test
  
  build:
    name: Build Backend
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm install
      
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      
      - name: Build application
        working-directory: backend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-build
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
  
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: backend-build
          path: backend-deployment
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_VALUE }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Get EC2 instance information
        run: |
          echo "Getting EC2 instance details"
          aws ec2 describe-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }} --query 'Reservations[*].Instances[*].{State:State.Name,PublicDnsName:PublicDnsName}' --output json
      
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      
      - name: Setup known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_INSTANCE }} >> ~/.ssh/known_hosts
      
      - name: Copy files to EC2
        run: |
          rsync -avz --delete \
            backend-deployment/ \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_INSTANCE }}:/home/${{ secrets.EC2_USERNAME }}/backend/
      
      - name: Deploy application
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_INSTANCE }} << 'EOF'
            cd ~/backend
            npm install --production
            pm2 stop backend || true
            pm2 start dist/index.js --name backend
            pm2 save
          EOF 