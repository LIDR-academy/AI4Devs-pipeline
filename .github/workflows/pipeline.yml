# =============================================================================
# CI/CD Pipeline Backend - GitHub Actions
# =============================================================================
# Este workflow se ejecuta SOLO cuando:
# 1. Se hace push a una rama (excepto main/master)
# 2. Esa rama tiene un Pull Request abierto (en el repo actual O en upstream si es fork)
#
# Jobs:
# 1. check-pr: Verifica si existe PR abierto para la rama (soporta forks)
# 2. test: Ejecuta tests del backend
# 3. build: Compila TypeScript y genera artifact
# 4. deploy: Despliega en EC2 via SSH
# =============================================================================

name: CI/CD Pipeline Backend

on:
    push:
        branches-ignore:
            - main
            - master

# Permisos necesarios para el GITHUB_TOKEN
permissions:
    contents: read
    pull-requests: read

jobs:
    # ===========================================================================
    # Job 1: Verificar si existe PR abierto
    # ===========================================================================
    check-pr:
        name: Verificar PR Abierto
        runs-on: ubuntu-latest
        outputs:
            has_pr: ${{ steps.check.outputs.has_pr }}
        steps:
            - name: Verificar si la rama tiene PR abierto
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  BRANCH="${{ github.ref_name }}"
                  REPO="${{ github.repository }}"
                  OWNER="${{ github.repository_owner }}"

                  echo "🔍 Buscando PRs abiertos para la rama: $BRANCH"
                  echo "📂 Repositorio actual: $REPO"

                  # Buscar PRs en el repositorio actual
                  PR_COUNT=$(gh pr list --repo $REPO --head $BRANCH --state open --json number --jq 'length')
                  echo "📊 PRs en repo actual ($REPO): $PR_COUNT"

                  # Si no hay PRs, verificar si es un fork y buscar en el upstream
                  if [ "$PR_COUNT" -eq 0 ]; then
                    echo "🔄 Verificando si el repositorio es un fork..."
                    
                    # Obtener info del repositorio para ver si es fork
                    PARENT_REPO=$(gh api repos/$REPO --jq '.parent.full_name // empty')
                    
                    if [ -n "$PARENT_REPO" ]; then
                      echo "🍴 Es un fork de: $PARENT_REPO"
                      echo "🔍 Buscando PRs en upstream con headRefName=$BRANCH..."
                      
                      # Para PRs cross-fork, --head no funciona bien, usamos jq para filtrar
                      PR_COUNT=$(gh pr list --repo $PARENT_REPO --state open --json number,headRefName --jq "[.[] | select(.headRefName == \"$BRANCH\")] | length")
                      echo "📊 PRs en upstream ($PARENT_REPO): $PR_COUNT"
                    else
                      echo "📌 No es un fork, no hay upstream que verificar"
                    fi
                  fi

                  # Evaluar resultado final
                  if [ "$PR_COUNT" -gt 0 ]; then
                    echo "✅ Rama tiene PR abierto - Pipeline continuará"
                    echo "has_pr=true" >> $GITHUB_OUTPUT
                  else
                    echo "⏭️ Rama NO tiene PR abierto - Pipeline se detendrá"
                    echo "has_pr=false" >> $GITHUB_OUTPUT
                  fi

    # ===========================================================================
    # Job 2: Ejecutar Tests
    # ===========================================================================
    test:
        name: Ejecutar Tests
        needs: check-pr
        if: needs.check-pr.outputs.has_pr == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout código
              uses: actions/checkout@v4

            - name: Configurar Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Instalar dependencias
              run: npm ci

            - name: Generar Prisma Client
              run: npx prisma generate

            - name: Ejecutar tests
              run: npm test

    # ===========================================================================
    # Job 3: Build
    # ===========================================================================
    build:
        name: Compilar Backend
        needs: test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout código
              uses: actions/checkout@v4

            - name: Configurar Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Instalar dependencias
              run: npm ci

            - name: Generar Prisma Client
              run: npx prisma generate

            - name: Compilar TypeScript
              run: npm run build

            - name: Verificar build
              run: |
                  if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
                    echo "✅ Build exitoso - directorio dist/ contiene archivos"
                    ls -la dist/
                  else
                    echo "❌ Error: directorio dist/ vacío o no existe"
                    exit 1
                  fi

            - name: Preparar artifact
              run: |
                  mkdir -p artifact
                  cp -r dist artifact/
                  cp package.json artifact/
                  cp package-lock.json artifact/
                  cp -r prisma artifact/

            - name: Subir artifact
              uses: actions/upload-artifact@v4
              with:
                  name: backend-build-${{ github.sha }}
                  path: backend/artifact/
                  retention-days: 7

    # ===========================================================================
    # Job 4: Deploy a EC2
    # ===========================================================================
    deploy:
        name: Desplegar en EC2
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Descargar artifact
              uses: actions/download-artifact@v4
              with:
                  name: backend-build-${{ github.sha }}
                  path: ./artifact

            - name: Verificar contenido del artifact
              run: |
                  echo "📦 Contenido del artifact:"
                  ls -la ./artifact/

            - name: Configurar SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

            - name: Transferir archivos a EC2
              run: |
                  echo "📤 Transfiriendo archivos a EC2..."
                  rsync -avz --delete \
                    -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
                    ./artifact/ \
                    ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}/

            - name: Ejecutar comandos de despliegue en EC2
              run: |
                  echo "🚀 Ejecutando comandos de despliegue..."
                  ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                    ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

                  cd ${{ secrets.EC2_DEPLOY_PATH }}

                  echo "📦 Instalando dependencias de producción..."
                  npm ci --production

                  echo "🔧 Generando Prisma Client..."
                  npx prisma generate

                  echo "🔄 Reiniciando aplicación con PM2..."
                  pm2 reload lti-backend || pm2 start dist/index.js --name lti-backend

                  echo "✅ Despliegue completado"
                  pm2 status

                  ENDSSH

            - name: Limpiar clave SSH
              if: always()
              run: rm -f ~/.ssh/deploy_key
