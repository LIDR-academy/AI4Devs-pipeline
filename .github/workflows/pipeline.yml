name: Backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - pipeline-XES

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend
