name: Backend Deployment Pipeline

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches:
      - 'pipeline-OS'
      - 'main'
      - 'master'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only run if the CI workflow was successful and it's the pipeline-OS branch
    if: |
      github.event.workflow_run.conclusion == 'success' && 
      (github.event.workflow_run.head_branch == 'pipeline-OS')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.5.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Download artifacts from CI workflow
        uses: dawidd6/action-download-artifact@v2.27.0
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          workflow_conclusion: success
          name: backend-build
          path: backend-deployment
      
      - name: Verify artifact download
        run: |
          ls -la backend-deployment
          if [ ! -d "backend-deployment/dist" ]; then
            echo "Failed to find dist directory in downloaded artifacts"
            exit 1
          fi
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_VALUE }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Get EC2 instance information
        run: |
          echo "Getting EC2 instance details"
          aws ec2 describe-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }} --query 'Reservations[*].Instances[*].{State:State.Name,PublicDnsName:PublicDnsName}' --output json
      
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      
      - name: Setup known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_INSTANCE }} >> ~/.ssh/known_hosts
      
      - name: Copy files to EC2
        run: |
          rsync -avz --delete \
            backend-deployment/ \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_INSTANCE }}:/home/${{ secrets.EC2_USERNAME }}/backend/
      
      - name: Deploy application
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_INSTANCE }} << 'EOF'
            cd ~/backend
            npm install --production
            pm2 stop backend || true
            pm2 start dist/index.js --name backend
            pm2 save
          EOF